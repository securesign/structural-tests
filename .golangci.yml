version: "2"

formatters:
  disable:
    - gci
    - gofumpt

linters:
  default: all
  disable:
    - depguard
    - exhaustruct
    - nlreturn
    - paralleltest
    - revive
    - testpackage
    - wsl
    - err113
    # newly surfaced by golangci-lint v2 migration — fix separately
    - embeddedstructfieldcheck
    - errcheck
    - ginkgolinter
    - goconst
    - godoclint
    - gosec
    - modernize
    - noinlineerr
    - perfsprint
    - staticcheck
    - wsl_v5
  settings:
    lll:
      line-length: 170
    cyclop:
      max-complexity: 15
