        - {path: /binaries/cosign_linux_arm64.tar.gz, os: linux, arch: arm64}
        - {path: /binaries/cosign_linux_ppc64le.tar.gz, os: linux, arch: ppc64le}
        - {path: /binaries/cosign_linux_s390x.tar.gz, os: linux, arch: s390x}
        - {path: /binaries/cosign_darwin_amd64.tar.gz, os: darwin, arch: amd64}
        - {path: /binaries/cosign_darwin_arm64.tar.gz, os: darwin, arch: arm64}
